<!doctype html>
<html>
<head><meta charset="utf-8"><title>Secrets</title></head>
<body>
<h2>Your secrets</h2>

<p style="color:green" th:text="${msg}"></p>
<p style="color:red" th:text="${err}"></p>

<h3>Create</h3>
<form method="post" action="/ui/user/secrets">
    <div>Plaintext: <input name="plaintext" style="width:400px"></div>
    <div>
        Algorithm:
        <select name="algorithm">
            <option value="KUZNECHIK">KUZNECHIK</option>
            <option value="RSA_TEXTBOOK">RSA_TEXTBOOK</option>
            <option value="HYBRID_RSA_KUZNECHIK">HYBRID_RSA_KUZNECHIK</option>
        </select>
    </div>
    <button type="submit">Create</button>
</form>

<hr>

<table border="1" cellpadding="6">
    <tr>
        <th>ID</th><th>Alg</th><th>Plaintext</th><th>Ciphertext (Base64)</th><th>Actions</th>
    </tr>
    <tr th:each="s : ${secrets}">
        <td th:text="${s.id}"></td>
        <td th:text="${s.algorithm}"></td>
        <td th:text="${s.plaintext}"></td>
        <td><code th:text="${s.ciphertextBase64}"></code></td>
        <td>
            <a th:href="'/ui/user/secrets/' + ${s.id} + '/decrypt'">Decrypt</a>
            |
            <a th:href="'/ui/user/secrets/' + ${s.id} + '/pdf'">PDF</a>
        </td>
    </tr>
</table>

<form method="post" action="/ui/logout" style="margin-top:16px">
    <button type="submit">Logout</button>
</form>

</body>
</html>
