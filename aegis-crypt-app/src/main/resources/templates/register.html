<!doctype html>
<html>
<head><meta charset="utf-8"><title>Register</title></head>
<body>
<h2>Register</h2>
<form method="post" action="/ui/register">
    <div>Email: <input name="email"></div>
    <div>Password: <input name="password" type="password"></div>
    <div>Display name: <input name="displayName"></div>
    <button type="submit">Register</button>
</form>
<p style="color:green" th:text="${msg}"></p>
<p style="color:red" th:text="${err}"></p>
<a href="/">Back</a>
</body>
</html>
